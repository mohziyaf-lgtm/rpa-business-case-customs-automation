<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="620" fill="#F8F9FB"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="44" fill="#1B3A6B"/>
  <text x="600" y="28" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Customs Documentation Completeness Check — Future State (To-Be) Process Map with RPA Automation</text>

  <!-- Swim lane labels -->
  <rect x="0" y="44" width="120" height="576" fill="#2E5B9A"/>

  <!-- Swim lane 1: Operations Team -->
  <rect x="120" y="44" width="1080" height="150" fill="#EEF2F8" stroke="#C5D0E0" stroke-width="1"/>
  <text x="130" y="64" fill="#1B3A6B" font-size="11" font-weight="bold">Operations Team</text>

  <!-- Swim lane 2: RPA Bot -->
  <rect x="120" y="194" width="1080" height="180" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="130" y="214" fill="#27500A" font-size="11" font-weight="bold">RPA Bot (Automation Anywhere)</text>
  <text x="130" y="228" fill="#27500A" font-size="9">Automated — no human intervention required</text>

  <!-- Swim lane 3: CargoWise -->
  <rect x="120" y="374" width="1080" height="100" fill="#F5F7FA" stroke="#C5D0E0" stroke-width="1"/>
  <text x="130" y="394" fill="#1B3A6B" font-size="11" font-weight="bold">CargoWise One</text>

  <!-- Swim lane 4: External -->
  <rect x="120" y="474" width="1080" height="146" fill="#EEF2F8" stroke="#C5D0E0" stroke-width="1"/>
  <text x="130" y="494" fill="#1B3A6B" font-size="11" font-weight="bold">Broker / Customs Authority</text>

  <!-- ── LANE 1: Operations Team ── -->

  <!-- Start event -->
  <circle cx="175" cy="119" r="20" fill="#1B3A6B"/>
  <circle cx="175" cy="119" r="14" fill="none" stroke="white" stroke-width="2"/>
  <text x="175" y="155" text-anchor="middle" fill="#333" font-size="9">Booking</text>
  <text x="175" y="167" text-anchor="middle" fill="#333" font-size="9">Confirmed</text>

  <!-- Task: Operator initiates -->
  <rect x="215" y="89" width="120" height="60" rx="8" fill="white" stroke="#2E5B9A" stroke-width="2"/>
  <text x="275" y="113" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Booking Entered</text>
  <text x="275" y="127" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">in CargoWise</text>
  <text x="275" y="141" text-anchor="middle" fill="#555" font-size="9">Operator — same as before</text>

  <!-- RPA trigger notification -->
  <rect x="870" y="89" width="140" height="60" rx="8" fill="white" stroke="#2E5B9A" stroke-width="2"/>
  <text x="940" y="110" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Receive Exception</text>
  <text x="940" y="124" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Alert if Required</text>
  <text x="940" y="138" text-anchor="middle" fill="#555" font-size="9">Only on bot escalation</text>

  <!-- Submit -->
  <rect x="1030" y="89" width="120" height="60" rx="8" fill="white" stroke="#2E5B9A" stroke-width="2"/>
  <text x="1090" y="113" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Review and</text>
  <text x="1090" y="127" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Submit Package</text>
  <text x="1090" y="141" text-anchor="middle" fill="#555" font-size="9">Operator — post validation</text>

  <!-- ── LANE 2: RPA Bot ── -->

  <!-- Bot Task 1: Monitor trigger -->
  <rect x="360" y="214" width="130" height="60" rx="8" fill="#D4EDDA" stroke="#27500A" stroke-width="2"/>
  <text x="425" y="236" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Monitor CargoWise</text>
  <text x="425" y="250" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">for New Bookings</text>
  <text x="425" y="264" text-anchor="middle" fill="#27500A" font-size="9">🤖 Bot — continuous</text>

  <!-- Bot Task 2: Extract shipment data -->
  <rect x="510" y="214" width="130" height="60" rx="8" fill="#D4EDDA" stroke="#27500A" stroke-width="2"/>
  <text x="575" y="236" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Extract Shipment</text>
  <text x="575" y="250" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">and Document Data</text>
  <text x="575" y="264" text-anchor="middle" fill="#27500A" font-size="9">🤖 Bot — automated</text>

  <!-- Bot Task 3: Run completeness check -->
  <rect x="660" y="214" width="130" height="60" rx="8" fill="#D4EDDA" stroke="#27500A" stroke-width="2"/>
  <text x="725" y="236" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Run Completeness</text>
  <text x="725" y="250" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Check Against Rules</text>
  <text x="725" y="264" text-anchor="middle" fill="#27500A" font-size="9">🤖 Bot — rule-based</text>

  <!-- Gateway: Complete? -->
  <polygon points="820,244 855,214 890,244 855,274" fill="#EAF3DE" stroke="#27500A" stroke-width="2"/>
  <text x="855" y="241" text-anchor="middle" fill="#27500A" font-size="9" font-weight="bold">All</text>
  <text x="855" y="253" text-anchor="middle" fill="#27500A" font-size="9" font-weight="bold">Docs OK?</text>

  <!-- No path: escalate -->
  <rect x="870" y="214" width="130" height="60" rx="8" fill="#FFF0F0" stroke="#E24B4A" stroke-width="2"/>
  <text x="935" y="236" text-anchor="middle" fill="#A32D2D" font-size="10" font-weight="bold">Generate Alert</text>
  <text x="935" y="250" text-anchor="middle" fill="#A32D2D" font-size="10" font-weight="bold">and Escalate</text>
  <text x="935" y="264" text-anchor="middle" fill="#555" font-size="9">🤖 Bot — auto notify</text>
  <text x="935" y="200" text-anchor="middle" fill="#E24B4A" font-size="9" font-weight="bold">No — estimated 3% after fix</text>

  <!-- Yes path: approve and log -->
  <rect x="870" y="294" width="130" height="60" rx="8" fill="#D4EDDA" stroke="#27500A" stroke-width="2"/>
  <text x="935" y="316" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Log Validation</text>
  <text x="935" y="330" text-anchor="middle" fill="#27500A" font-size="10" font-weight="bold">Pass in CargoWise</text>
  <text x="935" y="344" text-anchor="middle" fill="#27500A" font-size="9">🤖 Bot — auto log</text>
  <text x="975" y="260" fill="#27500A" font-size="9" font-weight="bold">Yes</text>

  <!-- ── LANE 3: CargoWise ── -->

  <!-- Auto milestone update -->
  <rect x="1030" y="394" width="130" height="50" rx="8" fill="white" stroke="#2E5B9A" stroke-width="2"/>
  <text x="1095" y="413" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Auto-Update</text>
  <text x="1095" y="427" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Shipment Milestone</text>
  <text x="1095" y="441" text-anchor="middle" fill="#555" font-size="9">Automated — no delay</text>

  <!-- ── LANE 4: External ── -->
  <rect x="1030" y="494" width="130" height="55" rx="8" fill="white" stroke="#2E5B9A" stroke-width="2"/>
  <text x="1095" y="516" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Broker Receives</text>
  <text x="1095" y="530" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Complete Package</text>
  <text x="1095" y="544" text-anchor="middle" fill="#555" font-size="9">Validated before receipt</text>

  <!-- End event -->
  <circle cx="1175" cy="521" r="20" fill="white" stroke="#1B3A6B" stroke-width="4"/>
  <circle cx="1175" cy="521" r="12" fill="#1B3A6B"/>
  <text x="1175" y="555" text-anchor="middle" fill="#333" font-size="9">Clearance</text>
  <text x="1175" y="567" text-anchor="middle" fill="#333" font-size="9">Granted</text>

  <!-- ── IMPROVEMENT ANNOTATIONS ── -->
  <rect x="340" y="285" width="150" height="38" rx="4" fill="#D4EDDA" stroke="#27500A" stroke-width="1"/>
  <text x="415" y="300" text-anchor="middle" fill="#27500A" font-size="9" font-weight="bold">✓ Replaces manual check</text>
  <text x="415" y="314" text-anchor="middle" fill="#27500A" font-size="9">Zero operator effort required</text>

  <rect x="640" y="285" width="150" height="38" rx="4" fill="#D4EDDA" stroke="#27500A" stroke-width="1"/>
  <text x="715" y="300" text-anchor="middle" fill="#27500A" font-size="9" font-weight="bold">✓ Rule-based validation</text>
  <text x="715" y="314" text-anchor="middle" fill="#27500A" font-size="9">100% consistent, no memory gaps</text>

  <!-- ── DEFS ── -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2E5B9A"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27500A"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E24B4A"/>
    </marker>
  </defs>

  <!-- Arrows -->
  <line x1="195" y1="119" x2="213" y2="119" stroke="#2E5B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="119" x2="358" y2="244" stroke="#2E5B9A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="490" y1="244" x2="508" y2="244" stroke="#27500A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="244" x2="658" y2="244" stroke="#27500A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="790" y1="244" x2="818" y2="244" stroke="#27500A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="855" y1="214" x2="935" y2="194" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="855" y1="274" x2="870" y2="324" stroke="#27500A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="935" y1="214" x2="940" y2="151" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="1000" y1="119" x2="1028" y2="119" stroke="#2E5B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="324" x2="1095" y2="392" stroke="#27500A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1090" y1="149" x2="1090" y2="392" stroke="#2E5B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1095" y1="444" x2="1095" y2="492" stroke="#2E5B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="521" x2="1153" y2="521" stroke="#1B3A6B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="122" y="590" width="958" height="24" fill="#E8ECF4" rx="4"/>
  <rect x="140" y="597" width="14" height="10" rx="2" fill="white" stroke="#2E5B9A" stroke-width="1.5"/>
  <text x="160" y="607" fill="#333" font-size="9">Manual Task</text>
  <rect x="250" y="597" width="14" height="10" rx="2" fill="#D4EDDA" stroke="#27500A" stroke-width="1.5"/>
  <text x="270" y="607" fill="#333" font-size="9">🤖 RPA Automated Task</text>
  <rect x="410" y="597" width="14" height="10" rx="2" fill="#FFF0F0" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="430" y="607" fill="#333" font-size="9">Exception Path</text>
  <polygon points="530,607 540,597 550,607 540,617" fill="#EAF3DE" stroke="#27500A" stroke-width="1.5"/>
  <text x="558" y="607" fill="#333" font-size="9">Bot Decision Gateway</text>
  <text x="700" y="607" fill="#27500A" font-size="9" font-weight="bold">✓ Bot handles 97%+ of validations automatically — operator only notified on exception</text>
</svg>
